[project]
name = "voip-audit"
version = "0.0.1"
description = "Interactive VoIP review and reporting tool"
readme = "README.md"
requires-python = ">=3.10"

authors = [
    { name = "Charalampos Spanias" }
]

dependencies = [
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0"
]

keywords = [
    "security",
    "voip",
    "telephony",
    "communications",
    "sip",
    "pbx",
    "audit",
    "assessment",
    "review",
    "compliance",
    "cybersecurity"
]

[project.scripts]
voip-audit = "voip_audit.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
voip_audit = ["data/*.yaml"]