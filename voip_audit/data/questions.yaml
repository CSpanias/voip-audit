# Assessment question definitions.
#
# This file contains all security controls assessed during VoIP platform 
# configuration reviews.
#
# The assessment focuses on the security configuration of VoIP infrastructure 
# components, including Session Border Controllers (SBCs), voice gateways, 
# administrative interfaces, authentication services, cryptographic settings, 
# logging capabilities, and supporting network security controls.
#
# Each question includes:
# - Vulnerability mapping
# - Compliance expectations
# - Remediation guidance
# - Positive observations
# - Vendor-specific navigation hints
#
# Questions should be maintained within this file rather than being hard-coded 
# into the application.
#
# Response Options:
# 1. Compliant
# 2. Non-Compliant
# 3. Not Applicable
# 4. Unknown
#
# Questions should be phrased so that the secure configuration state always 
# results in a "Compliant" response.
#
# The current assessment baseline is primarily targeted at AudioCodes VoIP 
# infrastructure. Future platform-specific controls may be introduced through 
# vendor filtering without requiring changes to the application logic.


#-------------------------------------------------------------------------------
# PLATFORM CONFIGURATION
#-------------------------------------------------------------------------------

- finding_id: unsupported-software-version
  finding_title: Unsupported Software Version
  theme: Platform Configuration
  commentary_group: Platform Configuration and Lifecycle Management
  section: platform_configuration
  remediation_id: platform_lifecycle

  question: Is the AudioCodes platform running a supported software version?

  expected_answer: compliant

  vendors:
    - AudioCodes

  hints:
    common: |
      Review the firmware version and update status of the assessed platform. 
      Confirm the platform is running a vendor-supported software release.

    audiocodes: |
      Navigate to the system information or software version page and review 
      the installed firmware version. Confirm the release is supported by 
      AudioCodes and that current security updates have been applied.

  description: >
    The AudioCodes platform was running unsupported, end-of-life, or 
    insufficiently patched software.

  commentary: >
    Outdated VoIP infrastructure may be exposed to publicly known security 
    vulnerabilities and may no longer receive security updates from the vendor. 
    As VoIP platforms often process business-critical communications and may be 
    accessible from untrusted networks, exploitation of known vulnerabilities 
    could result in unauthorised access, service disruption, fraud, or 
    compromise of administrative functions.

  solution: >
    Establish a lifecycle management process to ensure the AudioCodes platform 
    remains supported, maintained, and fully patched in accordance with vendor 
    guidance.

  positive: >
    The assessed AudioCodes platform was running a supported and fully patched 
    software version.

  expected_value: |
    The platform is running a supported and fully patched software version.

#-------------------------------------------------------------------------------
# AUTHENTICATION
#-------------------------------------------------------------------------------

- finding_id: admin-mfa-not-enforced
  finding_title: Administrator Multi-Factor Authentication Not Enforced
  theme: Authentication
  commentary_group: Authentication and Identity
  section: authentication
  remediation_id: identity_and_access_management

  question: Is multi-factor authentication enforced for administrative access 
    where supported?

  expected_answer: compliant

  vendors:
    - AudioCodes

  hints:
      common: |
        Review the authentication requirements for administrative access to the 
        AudioCodes platform and confirm whether privileged users are required 
        to complete multi-factor authentication.

  description: >
    Multi-factor authentication was not enforced for administrative accounts.

  commentary: >
    Administrative accounts provide highly privileged access to the VoIP 
    environment. Compromise of such accounts may allow an attacker to modify 
    configurations, weaken security controls, intercept communications, or 
    disrupt telephony services.

  solution: >
    Configure multi-factor authentication as a mandatory control for all 
    administrative and privileged accounts where supported.

  positive: >
    Multi-factor authentication was enforced for administrative access.

  expected_value: |
    MFA is enforced for administrative access where supported by the
    deployment architecture and authentication platform. Examples include:

    - AudioCodes Live / IAM
    - Federated identity providers
    - SAML-based authentication
    - Other MFA-capable authentication systems

    For standalone on-premises AudioCodes devices using local administrative 
    accounts only, native MFA may not be available.

- finding_id: weak-password-policy
  finding_title: Weak Password Policy Configured
  theme: Authentication
  commentary_group: Authentication and Identity
  section: authentication
  remediation_id: identity_and_access_management

  question: Are strong password controls enforced for local administrative 
    accounts?

  expected_answer: compliant

  vendors:
    - AudioCodes

  hints:
    common: |
      Review password policy settings and confirm strong password requirements 
      are enforced for administrative accounts.

    audiocodes: |
      Setup > Administration > Web & CLI > Local Users / Web Settings

      Review password complexity, history, age, and weak password detection.

  description: >
    Weak password controls were configured for administrative accounts.

  commentary: >
    Weak password requirements increase the likelihood of credential compromise 
    through password guessing, reuse, or brute-force attacks. Administrative 
    accounts should be protected by strong password controls.

  solution: >
    Enforce strong password complexity requirements, prevent password reuse, 
    and implement controls that identify or restrict the use of weak passwords.

  positive: >
    Strong password controls were enforced for administrative accounts.

  expected_value: |
    - Password complexity: Enable (1)
    - Minimum password length: 8+ (default)
    - Password history: Enable (1)
    - Check weak passwords: Checked (also check the password list used)


- finding_id: authentication-bruteforce-protection-not-configured
  finding_title: Authentication Brute-Force Protection Not Configured
  theme: Authentication
  commentary_group: Authentication and Identity
  section: authentication
  remediation_id: identity_and_access_management

  question: Are protections implemented against repeated failed authentication 
    attempts?

  expected_answer: compliant

  vendors:
    - AudioCodes

  hints:
    common:
      Review authentication protection settings and confirm accounts are 
      temporarily restricted following repeated failed login attempts.

    audiocodes:
      Setup > Administration > Web & CLI > Local Users > Block Duration

      Setup > Administration > Web & CLI > Web Settings > Security > Deny 
      Authentication Timer / Deny Access On Fail Count 

  description: >
    Protections against repeated authentication failures were not configured.

  commentary: >
    Without brute-force protection controls, administrative accounts may be 
    vulnerable to password guessing and automated authentication attacks.

  solution: >
    Implement authentication protection mechanisms such as account lockout, 
    authentication throttling, back-off timers, or temporary source 
    restrictions following repeated failed login attempts.

  positive: >
    Protections were implemented against repeated failed authentication 
    attempts.

  expected_value: |
    - Deny Authentication Timer (IP-based) and Deny Access On Fail Count are 
      configured (Not 0)
    - Block Duration (account-based) is configured

- finding_id: shared-accounts-permitted
  finding_title: Shared Accounts Permitted
  theme: Authentication
  commentary_group: Authentication and Identity
  section: authentication
  remediation_id: identity_and_access_management

  question: Are individual administrator accounts required?

  expected_answer: compliant

  vendors:
    - AudioCodes

  hints:
    common:
      Review administrative accounts and confirm that access is assigned to 
      named individuals rather than shared or generic accounts.

    audiocodes: >
      Setup > Administration tab > Web & CLI folder > Local Users

  description: >
    Shared administrative accounts were permitted.

  commentary: >
    Shared accounts reduce accountability and make it difficult to attribute 
    administrative actions to specific individuals. This may hinder 
    investigations and weaken audit controls.

  solution: >
    Replace shared accounts with uniquely assigned administrator accounts to 
    improve accountability and auditability.

  positive: >
    Administrative access was performed using uniquely assigned accounts.

  expected_value: |
    Review configured user accounts and confirm access is assigned to named 
    individuals rather than shared accounts.

- finding_id: default-accounts-enabled
  finding_title: Default Accounts Enabled
  theme: Authentication
  commentary_group: Authentication and Identity
  section: authentication
  remediation_id: identity_and_access_management

  question: Are default accounts disabled or secured?

  expected_answer: compliant

  vendors:
    - AudioCodes

  hints:
    common: |
      Review locally configured accounts and determine whether any 
      vendor-supplied default accounts remain enabled with default credentials.

    audiocodes: |
      Setup > Administration > Web & CLI > Local Users

  description: >
    One or more default accounts remained enabled or were configured with 
    default credentials.

  commentary: >
    Default accounts are widely known, commonly documented, and may be targeted 
    by attackers during unauthorised access attempts. If default credentials 
    remain unchanged, an attacker may be able to obtain administrative access 
    without needing to compromise a legitimate user account.

  solution: >
    Disable default accounts where they are not required. If a default account 
    must remain enabled, ensure default credentials are replaced with strong 
    unique credentials and that access is appropriately restricted and 
    monitored.

  positive: >
    Default accounts had been removed, disabled, or secured with non-default 
    credentials.

  expected_value: |
    Review local accounts and confirm default accounts (Admin:Admin, User:User) 
    are secured, disabled, or removed.

#-------------------------------------------------------------------------------
# ADMINISTRATIVE SECURITY
#-------------------------------------------------------------------------------

- finding_id: http-management-enabled
  finding_title: Administrative Interface Accessible Over HTTP
  theme: Administrative Security
  commentary_group: Administrative Interface Security
  section: administrative_security
  remediation_id: administrative_interface_security

  question: Is administrative web access restricted to HTTPS only?

  expected_answer: compliant

  vendors:
    - AudioCodes

  hints:
    common: >
      Review the configured Web Interfaces and confirm:

        - HTTP access is disabled
        - HTTPS Only is enabled
        - A TLS Context is assigned to the management interface

        Where HTTPS is used, confirm the assigned TLS Context enforces 
        supported TLS versions and cryptographic settings.

    audiocodes: |
      Setup > Administration tab > Web & CLI folder > Web Interfaces

  description: >
    Administrative access to the platform was available over unencrypted HTTP.

  commentary: >
    HTTP does not provide confidentiality or integrity protection. 
    Administrator credentials and session data may be exposed to interception 
    by an attacker with access to the network path.

  solution: >
    Disable HTTP management access and enforce HTTPS for all administrative 
    activity.

  positive: >
    Administrative access was restricted to HTTPS.

  expected_value: |
    HTTPS Only

- finding_id: insecure-cli-access-enabled
  finding_title: Insecure Administrative CLI Access Enabled

  theme: Administrative Security
  commentary_group: Administrative Interface Security
  section: administrative_security
  remediation_id: administrative_interface_security

  question: Is administrative CLI access restricted to secure protocols?

  expected_answer: compliant

  vendors:
    - AudioCodes

  hints:
    common:
      Review SSH configuration and access controls. Confirm SSH access is 
      limited to authorised administrators and, where possible, restricted to 
      approved networks or management workstations.

    audiocodes: |
      Setup menu > Administration tab > Web & CLI folder > Telnet / SSH 
      Interfaces

  description: >
    An insecure management protocol was enabled for CLI administration.

  commentary: >
    Protocols such as Telnet do not provide confidentiality or integrity 
    protection. Administrative credentials and management traffic may be 
    exposed to interception by attackers with network access.

  solution: >
    Restrict SSH access to authorised administrators and approved management 
    networks.

  positive: >
    Administrative CLI access was restricted to secure protocols.

  expected_value: |
    SSH enabled, Telnet disabled

- finding_id: excessive-administrative-privileges
  finding_title: Administrative Accounts Not Assigned Appropriate Roles
  theme: Administrative Security
  commentary_group: Administrative Interface Security
  section: administrative_security
  remediation_id: privileged_access_governance

  question: Are administrative accounts assigned to appropriate built-in roles?

  expected_answer: compliant

  vendors:
    - AudioCodes

  hints:
    common: |
      Review configured management accounts and assigned user levels. Confirm 
      built-in role separation is used and that users are not unnecessarily 
      assigned highly privileged roles.

    audiocodes: |
      Setup > Administration tab > Web & CLI folder > Local Users

  description: >
    Administrative accounts were assigned excessive privilege levels or role 
    separation was not effectively utilised.

  commentary: >
    Excessive administrative privileges increase the risk of accidental
    misconfiguration, unauthorised changes, and misuse of privileged
    functionality. Assigning users to appropriate built-in roles helps limit 
    access to only the administrative capabilities required for their 
    responsibilities.

  solution: >
    Review management user accounts and assign the lowest privilege level 
    necessary. Use the built-in Monitor, Administrator, and Security 
    Administrator roles to separate administrative responsibilities where 
    appropriate.

  positive: >
    Administrative accounts were assigned appropriate built-in roles.

  expected_value: |
    Review User Levels:

    - Monitor
    - Administrator
    - Security Administrator

    Confirm role separation is used where appropriate and users are not 
    unnecessarily assigned Security Administrator privileges.

- finding_id: excessive-session-timeout
  finding_title: Administrative Session Timeout Not Appropriately Configured
  theme: Administrative Security
  commentary_group: Administrative Interface Security
  section: administrative_security
  remediation_id: administrative_interface_security

  question: Is the administrative session timeout configured appropriately?

  expected_answer: compliant

  vendors:
    - AudioCodes

  hints:
    common: |
      Review the web management session settings and confirm inactive 
      administrative sessions are automatically terminated after an appropriate 
      period of inactivity.

    audiocodes: |
      Setup > Administration tab > Web & CLI folder > Local Users > Web Session 
      Timeout

  description: >
    Administrative sessions remained active for longer than required.

  commentary: >
    Excessive session timeouts increase the likelihood of unauthorised access 
    through unattended or abandoned administrative sessions.

  solution: >
    Configure an appropriate inactivity timeout to ensure unused administrative 
    sessions are automatically terminated.

  positive: >
    Administrative sessions were terminated following an appropriate period of 
    inactivity.

  expected_value: |
    15 (default) or less

- finding_id: web-hostname-not-enforced
  finding_title: Web Management Hostname Enforcement Not Configured

  theme: Administrative Security
  commentary_group: Administrative Interface Security
  section: administrative_security
  remediation_id: administrative_interface_security

  question: Is the web management interface configured to enforce access 
    through a hostname?

  expected_answer: compliant

  vendors:
    - AudioCodes

  hints:
    common: |
      Review web management settings and determine whether a hostname
      has been configured for the management interface and whether
      hostname enforcement is enabled.

    audiocodes: |
      Setup > Administration > Web & CLI > Web Settings > Web Server Name / 
      Enforce Web Host Name

  description: >
    The web management interface was accessible directly through its IP address 
    and hostname enforcement was not configured.

  commentary: >
    Accessing administrative interfaces through an approved hostname can help 
    reduce exposure to HTTP Host header attacks and DNS rebinding attacks. 
    Direct IP-based access may bypass hostname-based protections and increase 
    the risk of certain web application attack scenarios.

  solution: >
    Configure a dedicated hostname (FQDN) for the administrative web interface 
    and enable hostname enforcement where operationally feasible. Ensure the 
    hostname is correctly registered in DNS and administrative users access the 
    platform using the approved hostname.

  positive: >
    The web management interface was configured with an approved hostname and 
    hostname enforcement was enabled.

  expected_value: |
    - Web Server Name: not empty
    - Enforce Web Host Name: Enable

- finding_id: csrf-protection-not-enabled
  finding_title: Administrative Interface CSRF Protection Not Enabled

  theme: Administrative Security
  commentary_group: Administrative Interface Security
  section: administrative_security
  remediation_id: administrative_interface_security

  question: Is CSRF protection enabled for the web management interface?

  expected_answer: compliant

  vendors:
    - AudioCodes

  hints:
    common: |
      Review web management security settings and determine whether
      Cross-Site Request Forgery (CSRF) protection is enabled.

      Confirm the management interface validates user actions using
      anti-forgery tokens or equivalent request validation mechanisms.

    audiocodes: |
      System > Web > CSRFprotection

  description: >
    Cross-Site Request Forgery (CSRF) protection was not enabled for the
    administrative web interface.

  commentary: >
    CSRF attacks occur when an authenticated administrator is tricked
    into submitting unintended requests to a trusted management
    interface. If successful, an attacker may be able to perform
    administrative actions using the victim's authenticated session.

    CSRF protection uses unique request validation tokens to verify
    that configuration changes and other administrative actions
    originate from legitimate requests generated by the management
    interface rather than from malicious third-party websites.

  solution: >
    Enable CSRF protection for the web management interface and ensure
    administrative actions are validated using anti-forgery tokens or
    equivalent request validation mechanisms.

  positive: >
    CSRF protection was enabled and administrative actions were
    protected against forged web requests.

  expected_value: |
    - CSRFProtection: Enable (1) (default)

- finding_id: ssh-key-authentication-not-used
  finding_title: SSH Key-Based Authentication Not Used
  theme: Administrative Security
  commentary_group: Administrative Interface Security
  section: administrative_security
  remediation_id: administrative_interface_security

  question: Is SSH configured to use key-based authentication where 
    operationally feasible?

  expected_answer: compliant

  vendors:
    - AudioCodes

  hints:
    common: |
      Review SSH authentication settings and determine whether SSH access 
      relies on public/private key pairs rather than passwords where 
      operationally feasible.

    audiocodes: |
      Setup > Administration tab > Web & CLI folder > Local Users

  description: >
    SSH administration relied solely on password-based authentication.

  commentary: >
    Password-based SSH authentication is generally more susceptible to 
    credential attacks than key-based authentication. Public/private key 
    authentication can provide stronger assurance of administrator identity and
    reduce the risk of credential compromise.

  solution: >
    Implement SSH key-based authentication for administrative access where 
    operationally feasible and operational requirements permit.

  positive: >
    SSH administration used key-based authentication.

  expected_value: |
    SSH public keys are configured and SSHRequirePublicKey is enabled

#-------------------------------------------------------------------------------
# ACCESS CONTROL
#-------------------------------------------------------------------------------

- finding_id: insufficient-management-access-restrictions
  finding_title: Management Access Not Adequately Restricted
  theme: Access Control
  commentary_group: Administrative Access Control
  section: access_control
  remediation_id: privileged_access_governance

  question: Is management access restricted to approved systems or networks?

  expected_answer: compliant

  vendors:
    - AudioCodes

  hints:
    common: |
      Review management interface configuration and determine whether access is 
      restricted to approved management networks, hosts, or administrative 
      systems. Evidence may include:

      - OAMP interface separation
      - Firewall restrictions
      - Trusted host configuration
      - Dedicated management VLANs
      - Jump hosts

    audiocodes: |
      Setup > Administration tab > Web & CLI folder > Web Interfaces

  description: >
    Administrative management services were accessible from unnecessary systems 
    or networks.

  commentary: >
    Restricting management access reduces the attack surface of the platform 
    and helps protect administrative interfaces from unauthorised access 
    attempts originating from internal or external networks.

  solution: >
    Restrict management services to approved administrative workstations, jump 
    hosts, or management networks.

  positive: >
    Management access was restricted to approved systems and networks.

  expected_value: |
    Evidence exists that management services are restricted to approved
    management networks, hosts, or interfaces. Examples include:

    - Dedicated management VLANs
    - OAMP interfaces
    - Firewall restrictions
    - Trusted host restrictions
    - Jump hosts
    - Administrative workstations
    - Network segmentation

    Where no technical restriction exists, management services should not be 
    directly accessible from untrusted networks.

- finding_id: administrative-access-not-reviewed
  finding_title: Administrative Access Not Periodically Reviewed
  theme: Access Control
  commentary_group: Administrative Access Control
  section: access_control
  remediation_id: privileged_access_governance

  question: Are inactive administrative accounts identified and managed?

  expected_answer: compliant

  vendors:
    - AudioCodes

  hints:
    common: |
      Review administrative accounts for signs of inactivity. Determine whether 
      unused privileged accounts are identified and managed appropriately.

    audiocodes: |
      Setup > Administration > Web & CLI > Local Users > Status

      Setup > Administration > Web & CLI > Web Settings

  description: >
    Dormant, inactive, or unnecessary administrative accounts were not
    adequately identified or managed.

  commentary: >
    Privileged accounts that are no longer required may provide an unnecessary 
    attack surface and increase the risk of unauthorised access. The ability to 
    identify inactive users helps administrators detect dormant accounts and 
    manage access appropriately.

  solution: >
    Configure an appropriate User Inactivity Timeout and periodically review 
    administrative accounts. Disable, remove, or otherwise manage dormant, 
    inactive, and unnecessary privileged accounts.

  positive: >
    Inactive administrative accounts were identifiable and no unnecessary, 
    dormant, or unexplained privileged accounts were observed.

  expected_value: |
    - User Inactivity Timeout:  90 or less
    - No inactive privileged accounts are identified

#-------------------------------------------------------------------------------
# CRYPTOGRAPHY
#-------------------------------------------------------------------------------

- finding_id: weak-tls-configuration
  finding_title: Weak TLS Configuration
  theme: Cryptography
  commentary_group: Cryptography and Communications Security
  section: cryptography
  remediation_id: cryptography_and_communications

  question: Are only supported TLS versions permitted for administrative and
    VoIP communications?

  expected_answer: compliant

  vendors:
    - AudioCodes

  hints:
    common: |
      TLSv1.2, TLSv1.3, or TLSv1.2 and TLSv1.3 enabled. TLS 1.0 and TLS 1.1 
      disabled.

    audiocodes: |
      Setup > IP Network tab > Security folder > TLS Contexts > TLS Version

  description: >
    Older TLS versions were permitted for management or VoIP communications.

  commentary: >
    Deprecated TLS versions contain known weaknesses and may expose management 
    interfaces and VoIP communications to downgrade and cryptographic attacks.

  solution: >
    Enforce the use of TLS 1.2 and TLS 1.3 for management and VoIP 
    communications by removing support for older protocol versions.

  positive: >
    VoIP communications were restricted to supported TLS versions.

  expected_value: |
    Only TLS 1.2 and/or TLS 1.3 are permitted

- finding_id: weak-cryptography
  finding_title: Weak Cryptographic Algorithms Permitted
  theme: Cryptography
  commentary_group: Cryptography and Communications Security
  section: cryptography
  remediation_id: cryptography_and_communications

  question: Are only supported cryptographic algorithms and cipher suites
    permitted?

  expected_answer: compliant

  vendors:
    - AudioCodes

  hints:
    common: |
      Review cryptographic configuration including cipher suites, encryption
      algorithms, key exchange groups, and Diffie-Hellman parameters.
      Confirm deprecated, weak, or unnecessary cryptographic algorithms
      are disabled.

    audiocodes: |
      Setup > IP Network tab > Security folder > TLS Contexts > 
      Cipher Server / Cipher Client / Key Exchange Groups / DH Key Size

  description: >
    Weak or deprecated cryptographic algorithms, key exchange settings, or 
    cryptographic parameters remained enabled.

  commentary: >
    Weak or deprecated cryptographic settings may reduce the confidentiality 
    and integrity of administrative and VoIP communications. Legacy cipher 
    suites, weak key exchange mechanisms, and insufficient cryptographic 
    parameters may increase the risk of interception, downgrade attacks, or 
    compromise of encrypted communications.

  solution: >
    Align cryptographic settings with current vendor guidance and industry best 
    practice. Remove support for deprecated cipher suites, weak cryptographic 
    algorithms, and insufficient key exchange parameters.

  positive: >
    Strong, modern cryptographic algorithms and key exchange parameters were 
    enforced.

  expected_value: |
    - Cipher Server and Cipher Client: DEFAULT is accepted
    - Key Exchange Groups: X25519:P-256:P-384:X448 (default)
    - DH Key Size: 2048 bits or greater

- finding_id: signalling-and-media-encryption-not-enforced
  finding_title: VoIP Signalling and Media Encryption Not Enforced
  theme: Cryptography
  commentary_group: Cryptography and Communications Security
  section: cryptography
  remediation_id: cryptography_and_communications

  question: Are SIP signalling (SIPS) and voice communications (SRTP) encrypted 
    where supported?

  expected_answer: compliant

  vendors:
    - AudioCodes

  hints:
    common: |
      Review SIP trunk, gateway, and VoIP security configuration to determine 
      whether SIP signalling is protected using TLS and whether voice 
      communications are protected using SRTP where supported by connected 
      systems and service providers.

    audiocodes: |
      Setup > Signaling & Media > Media > Media Security (SRTP)

      Setup > Signaling & Media > SIP Definitions > Transport Settings (SIPS)

  description: >
    SIP signalling and/or RTP media traffic were transmitted without encryption 
    despite support for SIPS and SRTP being available.

  commentary: >
    VoIP communications consist of SIP signalling and RTP media traffic. SIP 
    signalling contains information used to establish and manage calls, while 
    RTP carries the voice conversation itself.

    Without SIPS (SIP over TLS), call metadata, routing information, and
    authentication details may be exposed to interception or manipulation.
    Without SRTP, voice conversations may be susceptible to eavesdropping by 
    attackers with access to the network path.

  solution: >
    Enable SIPS (SIP over TLS) for SIP signalling and Secure RTP (SRTP) for 
    voice media wherever supported by connected platforms, gateways, PBXs, and 
    service providers.

  positive: >
    SIP signalling was protected using SIPS and voice media was protected using 
    SRTP where supported by connected systems.

  expected_value: |
    - Media Security: Enable (SRTP)
    - SIPS: Enable (SIPS)

#-------------------------------------------------------------------------------
# THREAT PROTECTION
#-------------------------------------------------------------------------------

- finding_id: ids-not-configured
  finding_title: Intrusion Detection Controls Not Configured

  theme: Threat Protection
  commentary_group: Threat Detection and Protection
  section: threat_protection
  remediation_id: logging_and_monitoring

  question: Are intrusion detection controls configured to detect and respond 
    to malicious SIP activity?

  expected_answer: compliant

  vendors:
    - AudioCodes

  hints:
    common: |
      Review intrusion detection settings and confirm the platform is 
      configured to detect, alert on, and where appropriate block malicious 
      SIP activity.

    audiocodes: |
      Setup > Signaling & Media > Intrusion Detection > IDS General Settings / 
      IDS Policies

  description: >
    Intrusion detection controls were not configured to detect or respond to 
    malicious SIP activity.

  commentary: >
    Internet-facing VoIP platforms are commonly targeted by authentication 
    attacks, SIP scanning, malformed message attacks, denial-of-service 
    attempts, and toll-fraud activity. Intrusion detection controls can assist 
    in identifying and responding to malicious behaviour before it affects 
    platform availability or security.

  solution: >
    Enable intrusion detection functionality and configure policies that detect 
    authentication failures, malformed SIP messages, connection abuse, dialog 
    establishment failures, and other suspicious activity. Configure alerting 
    and blocking thresholds appropriate to the deployment.

  positive: >
    Intrusion detection controls were configured to detect and respond to 
    malicious SIP activity.

  expected_value: |
    - Intrusion Detection System (IDS): Enable
    - One or more IDS Policies are configured and applied.

#-------------------------------------------------------------------------------
# MONITORING
#-------------------------------------------------------------------------------

- finding_id: security-relevant-events-not-logged
  finding_title: Security-Relevant Events Not Logged
  theme: Monitoring and Detection
  commentary_group: Logging and Monitoring
  section: monitoring
  remediation_id: logging_and_monitoring

  question: Are security-relevant events, administrative actions, and
    configuration changes logged and retained?

  expected_answer: compliant

  vendors:
    - AudioCodes

  hints:
    common: |
      Review audit logging configuration and confirm that administrative 
      actions, configuration changes, and privileged account activity are 
      recorded and retained for investigation and accountability purposes.

    audiocodes: |
      Settings > Troubleshoot > Troubleshoot > Logging > Logging Settings

  description: >
    Administrative activity was not adequately logged or retained.

  commentary: >
    Audit logging provides visibility into authentication events, 
    administrative activity, configuration changes, software updates, and 
    security-relevant events. Comprehensive logging supports accountability, 
    security monitoring, incident response, and forensic investigation 
    following suspicious or unauthorised activity.

  solution: >
    Enable audit logging for administrative activity and retain logs in 
    accordance with organisational monitoring and retention requirements.

  positive: >
    Security-relevant events, administrative activity, and configuration 
    changes were logged and retained appropriately.

  expected_value: |
    The following are selected:
    - Device Software Upgrade
    - Non-Authorized Access
    - Sensitive Parameters Value Change
    - Login and Logout
    - CLI Activity
    - Action Executed

- finding_id: logs-not-centrally-exported
  finding_title: Security Logs Not Exported to Central Monitoring Platform
  theme: Monitoring and Detection
  commentary_group: Logging and Monitoring
  section: monitoring
  remediation_id: logging_and_monitoring

  question: Are logs exported to a centralised and access-controlled location?

  expected_answer: compliant

  vendors:
    - AudioCodes

  hints:
    common: |
      Determine whether logs are forwarded to an external logging platform and 
      whether they are retained outside the local device. Evidence may include:

      - Syslog server configuration
      - SIEM integration
      - Remote log collectors
      - Central monitoring platforms

  description: >
    Logs were stored locally only or were not adequately protected from 
    modification.

  commentary: >
    Centralised log collection improves the ability to detect andinvestigate 
    security incidents affecting VoIP infrastructure. Authentication events, 
    configuration changes, administrative activity, and intrusion detection 
    alerts may be lost if logs are retained only on the local device.

  solution: >
    Forward logs to a centralised logging platform and restrict access to 
    authorised personnel.

  positive: >
    Logs were exported to a centralised and access-controlled repository.

  expected_value: |
    Logs are exported to an external logging platform. Examples include:

    - Syslog server
    - SIEM platform
    - Central logging solution

    Evidence should identify the configured logging destination and confirm 
    that logs are retained outside the local device.