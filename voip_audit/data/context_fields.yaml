# Context fields collected before an assessment begins.
#
# These fields define the information required to describe
# the client's VoIP environment, including the telephony
# platform, deployment model, connectivity architecture,
# and supporting services.
#
# Fields are loaded dynamically by the application to allow
# future expansion without code changes.

- id: client_name
  label: What is the organisation's name?
  type: string
  required: true
  phase: setup

  vendors:
  - all

- id: voip_solution
  label: Which VoIP platform vendor is being reviewed?
  type: choice
  required: true
  phase: setup

  vendors:
    - all

  options:
    - AudioCodes
    - Other

- id: device_type
  label: Which VoIP platform component is being assessed?
  type: choice
  required: true
  phase: context

  vendors:
  - all

  options:
    - Session Border Controller (SBC)
    - Voice Gateway
    - Private Branch Exchange (PBX) / Call Manager
    - Cloud Voice Platform
    - Mixed Environment

- id: deployment_type
  label: How is the VoIP solution deployed?
  type: choice
  required: true
  phase: context

  vendors:
  - all

  options:
    - Cloud Hosted
    - On-Premises
    - Hybrid
    - Other

- id: identity_provider
  label: What is the primary identity provider / authentication source?
  type: choice
  required: true
  phase: context

  vendors:
  - all

  options:
    - Microsoft Entra ID
    - Active Directory
    - LDAP
    - RADIUS
    - Local Accounts
    - SAML / SSO
    - Other

  hints:
    common:
      Identify the authentication source used for administrator access to the 
      VoIP platform. This may differ from user authentication mechanisms used 
      by telephony services.

- id: sip_provider
  label: Which telephony service provider (SIP trunk) is used?
  type: string
  required: true
  phase: context

  vendors:
  - all

  hints:
    common: 
      Record the external SIP service provider used for PSTN connectivity.
      Examples include BT, Gamma, Vodafone, Virgin Media Business, and others.

- id: platform_model
  label: What platform model is being reviewed?
  type: string
  required: true
  phase: context

  vendors:
    - all

  hints:
    common: 
      Record the exact platform model (e.g. Mediant VE SBC, Mediant 800 SBC, 
      Mediant 1000 Gateway, Cisco Unified Border Element, or an equivalent 
      model).

    audiocodes: |
      Monitor > Summary > Device Information > Product Name

- id: software_version
  label: What software version is installed?
  type: string
  required: true
  phase: context

  vendors:
    - all

  hints:
    common: |
      Record the currently installed software, firmware, or operating system 
      version where available. This information is used to assess platform 
      supportability and patch status.

    audiocodes: |
      Monitor > Summary > Device Information > Version ID

- id: management_address
  label: What is the primary management IP address, hostname, or URL?
  type: string
  required: true
  phase: context

  vendors:
    - all

  hints:
    common: 
      Record the primary management IP address, FQDN, or hostname used to 
      administer the VoIP platform. This information is used for assessment 
      scoping, evidence collection, and reporting purposes.